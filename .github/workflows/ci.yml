name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]   # installer is bash; Windows users run it under WSL
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: run the test suite
        run: npm test
      - name: scan this repo with itself
        run: node scripts/scan.mjs . --exit-zero

  shell:
    name: shellcheck the installer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: syntax check
        run: bash -n docs/install.sh && bash -n scripts/build-zip.sh
      - name: shellcheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck -S warning -e SC2059 docs/install.sh scripts/build-zip.sh

  zip:
    name: the committed zip matches the skill
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: rebuild and diff
        run: |
          cp docs/vibe-check-skill.zip /tmp/committed.zip
          bash scripts/build-zip.sh
          if ! cmp -s /tmp/committed.zip docs/vibe-check-skill.zip; then
            echo "::error::docs/vibe-check-skill.zip is stale. Run: bash scripts/build-zip.sh && git add docs/vibe-check-skill.zip"
            exit 1
          fi
          echo "zip is up to date"
